openapi: 3.1.0
info:
  title: Antigravity Bridge
  version: 0.2.0-dev
  description: |
    OpenAI-compatible proxy over the Google Antigravity backend (`daily-cloudcode-pa.googleapis.com`).
    Uses each account's Google AI (Pro/Ultra) subscription via OAuth. Multi-account: each `Authorization: Bearer <api_key>`
    selects a Google account with its own quota.

    Extensions over OpenAI: native backend tools (`web_search`, `url_context`, `code_execution`), image output,
    `reasoning_effort` → model effort, `user` → deterministic session, real per-account quota.

    Prose reference: `docs/api-reference.md`. Captured protocol: `docs/agy-cli-protocol.md`.
servers:
  - url: http://127.0.0.1:52847
    description: local
tags:
  - name: openai
    description: OpenAI-compatible endpoints
  - name: quota
    description: Real Google quota per account
  - name: admin
    description: Account management (protected by BRIDGE_ADMIN_KEY)
  - name: auth
    description: OAuth login for the default account
  - name: system

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "Account api_key (accounts.json) or BRIDGE_API_KEY. Optional in single-account mode without BRIDGE_API_KEY."
    adminKey:
      type: http
      scheme: bearer
      description: BRIDGE_ADMIN_KEY. If unset, /admin/* is open.

  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                type: { type: string, example: upstream_error }
                code: { type: integer }

    ContentPart:
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type: { const: text }
            text: { type: string }
        - type: object
          required: [type, image_url]
          properties:
            type: { const: image_url }
            image_url:
              type: object
              properties:
                url: { type: string, description: "https://... or data:image/png;base64,..." }
        - type: object
          required: [type, input_audio]
          properties:
            type: { const: input_audio }
            input_audio:
              type: object
              properties:
                data: { type: string, description: base64 }
                format: { type: string, enum: [wav, mp3, m4a, aac, ogg, opus, flac, webm, pcm16] }
        - type: object
          required: [type, file]
          properties:
            type: { const: file }
            file:
              type: object
              description: PDF, text, audio or video. `file_data` (data URI) or `file_url`. Max 50 MB.
              properties:
                file_data: { type: string, description: "data:application/pdf;base64,..." }
                file_url: { type: string }
                filename: { type: string }
        - type: object
          required: [type, video_url]
          properties:
            type: { const: video_url }
            video_url: { type: object, properties: { url: { type: string } } }
        - type: object
          required: [type, audio_url]
          properties:
            type: { const: audio_url }
            audio_url: { type: object, properties: { url: { type: string } } }

    ToolCall:
      type: object
      properties:
        id: { type: string, example: call_714ced03058d417598f4abd7 }
        type: { const: function }
        function:
          type: object
          properties:
            name: { type: string }
            arguments: { type: string, description: JSON string }

    Message:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [system, user, assistant, tool, function] }
        content:
          oneOf:
            - type: string
            - type: "null"
            - type: array
              items: { $ref: "#/components/schemas/ContentPart" }
        name: { type: string }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
        tool_call_id: { type: string, description: "in role=tool messages" }

    FunctionTool:
      type: object
      properties:
        type: { const: function }
        function:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            parameters: { type: object, description: JSON Schema (fields Gemini rejects are stripped) }

    NativeTool:
      type: object
      description: Native backend tools (verified). Can be combined with function tools.
      properties:
        type:
          type: string
          enum: [web_search, web_search_preview, google_search, url_context, url_fetch, code_execution, code_interpreter]

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: |
            Catalog ID (`GET /v1/models`). Gemini models carry the effort in the id: `gemini-3.8-flash-low|medium|high`.
            `models/` prefix accepted. With `reasoning_effort` the suffix can be omitted.
          example: gemini-3.8-flash-low
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        stream: { type: boolean, default: false }
        stream_options:
          type: object
          properties: { include_usage: { type: boolean } }
        temperature: { type: number, default: 1.0 }
        top_p: { type: number, default: 0.95 }
        max_tokens: { type: integer, default: 8192, description: "capped to the model's max_output_tokens" }
        max_completion_tokens: { type: integer }
        n: { type: integer, maximum: 8 }
        seed: { type: integer }
        stop:
          oneOf: [ { type: string }, { type: array, items: { type: string } } ]
        response_format:
          type: object
          properties:
            type: { type: string, enum: [text, json_object, json_schema] }
            json_schema: { type: object }
        tools:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/FunctionTool"
              - $ref: "#/components/schemas/NativeTool"
        tool_choice:
          oneOf:
            - type: string
              enum: [auto, none, required]
            - type: object
        reasoning_effort:
          type: string
          enum: [low, medium, high]
          description: "→ model suffix (gemini-3.8-flash + high = gemini-3.8-flash-high). Ignored for Claude/GPT."
        thinking_budget:
          type: integer
          description: "Extension. Forces thinkingConfig.thinkingBudget (default: real catalog value; -1 = dynamic)."
        include_thoughts:
          type: boolean
          default: false
          description: Extension. Asks the model to include its reasoning (not surfaced in the response yet).
        web_search:
          type: boolean
          description: Extension. Enables Google Search grounding (= tools:[{type:web_search}]).
        web_search_options:
          type: object
          description: OpenAI compat. Any object enables web_search.
        url_context:
          type: boolean
          description: Extension. The model reads URLs found in the prompt.
        code_execution:
          type: boolean
          description: Extension. Google's Python sandbox.
        user:
          type: string
          description: |
            End-user identifier. Derives deterministic sessionId/conversation_id (sha256 api_key:user).
            There is no server-side memory; it only groups activity and improves prompt caching. Same as the X-Session-Id header.
        logprobs: { description: ignored }
        frequency_penalty: { description: ignored }
        presence_penalty: { description: ignored }
        logit_bias: { description: ignored }

    Citation:
      type: object
      properties:
        url: { type: string, description: "Google redirect; with BRIDGE_RESOLVE_CITATIONS=1 it is resolved to the real site" }
        title: { type: string }

    ImageOut:
      type: object
      properties:
        mime_type: { type: string, example: image/jpeg }
        b64_json: { type: string }

    ChatMessageOut:
      type: object
      properties:
        role: { const: assistant }
        content:
          type: [string, "null"]
          description: |
            Text. With code_execution it includes ```python (code) and ``` (output) blocks.
            With *-image models it includes `![image](data:image/...;base64,...)`.
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
        citations:
          type: array
          description: Extension (only with web_search).
          items: { $ref: "#/components/schemas/Citation" }
        search_queries:
          type: array
          description: Extension (only with web_search). Queries Google ran.
          items: { type: string }
        images:
          type: array
          description: Extension (image models only).
          items: { $ref: "#/components/schemas/ImageOut" }

    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer, description: includes thinking tokens when the model reasons }

    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string, example: chatcmpl-c71e19c29f73443d98a27769 }
        object: { const: chat.completion }
        created: { type: integer }
        model: { type: string, description: resolved ID (with effort suffix) }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: "#/components/schemas/ChatMessageOut" }
              finish_reason: { type: string, enum: [stop, tool_calls, length] }
        usage: { $ref: "#/components/schemas/Usage" }

    ChatCompletionChunk:
      type: object
      description: "Each SSE event: `data: {chunk}`; ends with `data: [DONE]`."
      properties:
        id: { type: string }
        object: { const: chat.completion.chunk }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              delta:
                type: object
                properties:
                  role: { type: string }
                  content: { type: string }
                  tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
              finish_reason: { type: [string, "null"] }
        usage: { $ref: "#/components/schemas/Usage" }

    Model:
      type: object
      properties:
        id: { type: string, example: gemini-3.8-flash-high }
        object: { const: model }
        owned_by: { type: string, example: google }
        created: { type: integer }
        display_name: { type: string, example: Gemini 3.8 Flash (High) }
        context_window: { type: integer, example: 1048576 }
        max_output_tokens: { type: integer, example: 65536 }
        supports_thinking: { type: boolean }
        supports_images: { type: boolean }
        supports_video: { type: boolean }
        input_modalities:
          type: array
          items: { type: string, enum: [text, image, audio, video, application] }
        web_search: { type: boolean, description: listed by the backend in webSearchModelIds }
        image_generation: { type: boolean }
        deprecated: { type: boolean }
        effort: { type: [string, "null"], enum: [low, medium, high, null] }

    ModelMetadata:
      allOf:
        - $ref: "#/components/schemas/Model"
        - type: object
          properties:
            metadata:
              type: object
              properties:
                model_enum: { type: string, example: MODEL_PLACEHOLDER_M318 }
                api_provider: { type: string, example: API_PROVIDER_GOOGLE_GEMINI }
                provider: { type: string }
                vertex_model_id: { type: [string, "null"], example: claude-opus-4-6@default }
                thinking_budget: { type: [integer, "null"], description: "-1 = dynamic" }
                min_thinking_budget: { type: [integer, "null"] }
                supported_mime_types: { type: array, items: { type: string } }
                audio_transcription: { type: boolean }
                recommended: { type: boolean }
                tag: { type: [string, "null"] }

    QuotaBucket:
      type: object
      properties:
        group: { type: string, example: Gemini Models }
        window: { type: string, enum: [weekly, 5h] }
        used_pct: { type: number, example: 1.1 }
        remaining_pct: { type: number }
        reset_at: { type: string, format: date-time }

    Quota:
      type: object
      properties:
        email: { type: string }
        label: { type: string }
        project: { type: string, example: aicode-consumers }
        buckets:
          type: object
          properties:
            gemini-weekly: { $ref: "#/components/schemas/QuotaBucket" }
            gemini-5h: { $ref: "#/components/schemas/QuotaBucket" }
            3p-weekly: { $ref: "#/components/schemas/QuotaBucket", description: Claude + GPT-OSS }
            3p-5h: { $ref: "#/components/schemas/QuotaBucket" }
        gemini_weekly_used: { type: number }
        gemini_5h_used: { type: number }
        claude_weekly_used: { type: number }
        claude_5h_used: { type: number }
        fetched_at: { type: integer }

    Account:
      type: object
      properties:
        api_key: { type: string }
        label: { type: string }
        email: { type: [string, "null"] }
        has_refresh_token: { type: boolean }
        health: { type: object }
        quota:
          description: only with ?quota=1
          type: [object, "null"]
          properties:
            gemini_weekly_used: { type: number }
            gemini_5h_used: { type: number }
            claude_weekly_used: { type: number }
            claude_5h_used: { type: number }
            fetched_at: { type: integer }
            error: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, needs_login, no_account] }
        email: { type: [string, "null"] }
        project_id: { type: [string, "null"] }
        accounts: { type: integer }
        credentials: { type: object }
        health: { type: object }
        rate_limiter: { type: object }
        token_expires_at: { type: integer }

    LoginStart:
      type: object
      properties:
        auth_url: { type: string, description: open in the browser }
        state: { type: string }
        expires_in: { type: integer, example: 120 }

paths:
  /:
    get:
      tags: [system]
      summary: Bridge info and endpoint list
      responses:
        "200": { description: ok }

  /health:
    get:
      tags: [system]
      summary: Status (never 500)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/models:
    get:
      tags: [openai]
      summary: Model catalog (fetchAvailableModels, 1h cache) with metadata
      parameters:
        - in: query
          name: cli
          schema: { type: string, enum: ["1"] }
          description: Only the 14 models shown by `agy models`
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { const: list }
                  data: { type: array, items: { $ref: "#/components/schemas/Model" } }

  /v1/models/{model_id}:
    get:
      tags: [openai]
      summary: One model with full metadata
      parameters:
        - in: path
          name: model_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelMetadata" }
        "404":
          description: not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/chat/completions:
    post:
      tags: [openai]
      summary: Chat (normal or streaming), tools, multimodal, native tools
      security: [ { apiKey: [] }, {} ]
      parameters:
        - in: header
          name: X-Session-Id
          schema: { type: string }
          description: Same as body.user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
            examples:
              simple:
                value: { model: gemini-3.8-flash-low, messages: [ { role: user, content: "responde unicamente: OK" } ] }
              grounding:
                value: { model: gemini-3.8-flash-low, web_search: true, messages: [ { role: user, content: "ultima version de opencode?" } ] }
              tools:
                value:
                  model: gemini-3.8-flash-low
                  messages: [ { role: user, content: "que clima hace en cuernavaca?" } ]
                  tools: [ { type: function, function: { name: get_weather, parameters: { type: object, properties: { city: { type: string } } } } } ]
              vision:
                value:
                  model: gemini-3.8-flash-high
                  messages: [ { role: user, content: [ { type: text, text: "que ves?" }, { type: image_url, image_url: { url: "https://goghl.ai/images/logo.png" } } ] } ]
              image_out:
                value: { model: gemini-3.1-flash-image, messages: [ { role: user, content: "un gato azul minimalista" } ] }
              effort:
                value: { model: gemini-3.8-flash, reasoning_effort: high, messages: [ { role: user, content: "hola" } ] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletionResponse" }
            text/event-stream:
              schema: { $ref: "#/components/schemas/ChatCompletionChunk" }
        "400": { description: invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: invalid api_key / no account }
        "429": { description: rate limit / quota exhausted (upstream) }
        "502": { description: upstream error }

  /v1/usage:
    get:
      tags: [openai]
      summary: Local per-model counters since startup (not the Google quota)
      responses:
        "200": { description: ok }

  /v1/quota:
    get:
      tags: [quota]
      summary: Real Google quota for the request's account
      security: [ { apiKey: [] }, {} ]
      parameters:
        - in: query
          name: refresh
          schema: { type: string, enum: ["1"] }
          description: bypass the cache (30 s)
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } }
        "401": { description: no account }
        "502": { description: upstream error }

  /v1/billing/subscription:
    get:
      tags: [openai]
      summary: Stub for clients (Hermes) that query the subscription
      responses:
        "200": { description: ok }

  /admin/accounts:
    get:
      tags: [admin]
      summary: List accounts
      security: [ { adminKey: [] }, {} ]
      parameters:
        - in: query
          name: quota
          schema: { type: string, enum: ["1"] }
          description: Adds each account's real Google quota (1 request/account, cached)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
    post:
      tags: [admin]
      summary: Create account
      security: [ { adminKey: [] }, {} ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, example: sk-account-2 }
                label: { type: string }
                refresh_token: { type: string, description: optional; otherwise log in }
      responses:
        "200": { description: created }

  /admin/accounts/{api_key}:
    delete:
      tags: [admin]
      summary: Delete account
      security: [ { adminKey: [] }, {} ]
      parameters:
        - { in: path, name: api_key, required: true, schema: { type: string } }
      responses:
        "200": { description: deleted }
        "404": { description: not found }

  /admin/accounts/{api_key}/login:
    post:
      tags: [admin]
      summary: Start OAuth for an account → auth_url
      security: [ { adminKey: [] }, {} ]
      parameters:
        - { in: path, name: api_key, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/LoginStart" } } }

  /admin/accounts/{api_key}/quota:
    get:
      tags: [quota, admin]
      summary: Real Google quota for one account
      security: [ { adminKey: [] }, {} ]
      parameters:
        - { in: path, name: api_key, required: true, schema: { type: string } }
        - { in: query, name: refresh, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } }
        "404": { description: account not found }
        "409": { description: account not logged in }
        "502": { description: upstream error }

  /admin/models/raw:
    get:
      tags: [admin]
      summary: Raw fetchAvailableModels (full backend metadata)
      security: [ { adminKey: [] }, {} ]
      responses:
        "200": { description: ok }

  /auth/login:
    post:
      tags: [auth]
      summary: Start OAuth for the default account (creates it if missing)
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/LoginStart" } } }
        "500": { description: incomplete config (CLIENT_ID/SECRET) }

  /auth/login/manual:
    post:
      tags: [auth]
      summary: Complete OAuth by pasting the redirect URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_url: { type: string, example: "http://localhost:51121/oauth-callback?code=...&state=..." }
                code: { type: string }
      responses:
        "200": { description: authenticated }

  /auth/login/status:
    get:
      tags: [auth]
      summary: Status of the login in progress
      responses:
        "200": { description: ok }

  /login:
    get:
      tags: [auth]
      summary: Web login page
      responses:
        "200": { description: html }

  /api/spec.yml:
    get:
      tags: [system]
      summary: This document (OpenAPI)
      responses:
        "200": { description: yaml }

  /docs:
    get:
      tags: [system]
      summary: Swagger UI
      responses:
        "200": { description: html }
